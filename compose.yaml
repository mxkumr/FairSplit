services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fairsplit
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/fairsplit
      JWT_SECRET: development-secret
      RESEND_API_KEY: dummy
      EMAIL_FROM: test@example.com
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairsplit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: